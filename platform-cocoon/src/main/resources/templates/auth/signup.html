<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up - AI Matching Platform</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center"
	style="min-height: 100vh;">
	<div class="card shadow-sm p-4" style="width: 480px;">
		<h3 class="text-center mb-4">🚀 Create Your Account</h3>

		<!-- ✅ MOVED INSIDE FORM CONTEXT BELOW -->

		<form method="POST" th:action="@{/auth/signup}"
			th:object="${signupRequest}">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />

			<!-- ✅ Error summary NOW inside th:object form -->
			<div th:if="${#fields.hasAnyErrors()}"
				class="alert alert-danger mb-3">
				<ul class="mb-0 ps-3">
					<li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
				</ul>
			</div>

			<!-- Flash messages (these use model attributes, NOT #fields) -->
			<div th:if="${success}" class="alert alert-success mb-3"
				th:text="${success}"></div>
			<div th:if="${danger}" class="alert alert-danger mb-3"
				th:text="${danger}"></div>

			<div class="mb-3">
				<label class="form-label">Username</label> <input type="text"
					th:field="*{username}" class="form-control"
					th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
					required minlength="3">
				<div class="invalid-feedback" th:errors="*{username}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Email</label> <input type="email"
					th:field="*{email}" class="form-control"
					th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
					required>
				<div class="invalid-feedback" th:errors="*{email}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Password</label> <input type="password"
					th:field="*{password}" class="form-control"
					th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
					required minlength="6">
				<div class="invalid-feedback" th:errors="*{password}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Confirm Password</label> <input
					type="password" th:field="*{confirmPassword}" class="form-control"
					th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
					required minlength="6">
				<div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
			</div>

			<div class="mb-4">
				<label class="form-label">I am a...</label> <select
					th:field="*{role}" class="form-select" id="roleSelect" required>
					<option value="">Select your role</option>
					<option value="candidate">Candidate (Looking for a job)</option>
					<option value="corp">Corporate (Hiring talent)</option>
				</select>
				<div class="invalid-feedback" th:errors="*{role}"></div>
			</div>

			<div class="mb-3 d-none" id="companyField">
				<label class="form-label">Company Name</label> <input type="text"
					th:field="*{companyName}" class="form-control"
					placeholder="e.g., TechCorp Inc."> <small
					class="text-muted">Used to identify your organization's
					configurations.</small>
				<div class="invalid-feedback" th:errors="*{companyName}"></div>
			</div>

			<button type="submit" class="btn btn-primary w-100 mb-3">Create
				Account</button>
		</form>

		<div class="text-center mt-3">
			<small>Already have an account? <a th:href="@{/auth/login}">Sign
					in here</a></small>
		</div>
	</div>

	<script>
		document.getElementById('roleSelect').addEventListener(
				'change',
				function() {
					const companyField = document
							.getElementById('companyField');
					const companyInput = companyField.querySelector('input');
					if (this.value === 'corp') {
						companyField.classList.remove('d-none');
						companyInput.required = true;
					} else {
						companyField.classList.add('d-none');
						companyInput.required = false;
					}
				});
		// Trigger on page load for re-rendered forms after validation errors
		document.getElementById('roleSelect')
				.dispatchEvent(new Event('change'));
	</script>
</body>
</html>
