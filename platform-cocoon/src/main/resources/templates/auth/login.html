<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Sign In - AI Matching Platform</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center"
	style="height: 100vh;">
	<div class="card shadow-sm p-4" style="width: 450px;">
		<h3 class="text-center mb-4">🔐 Sign In</h3>

		<!-- Flash messages -->
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
		<div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
		<div th:if="${warning}" class="alert alert-warning"
			th:text="${warning}"></div>

		<form method="POST" th:action="@{/auth/login}">
			<input type="hidden" th:name="${_csrf.parameterName}"
				th:value="${_csrf.token}" />

			<div class="mb-3">
				<label class="form-label">Username</label> <input type="text"
					name="username" class="form-control" required autofocus>
			</div>
			<div class="mb-3">
				<label class="form-label">Password</label> <input type="password"
					name="password" class="form-control" required>
			</div>

			<button type="submit" class="btn btn-primary w-100 mb-3">Sign
				In</button>
		</form>

		<div class="text-center">
			<small>Don't have an account? <a th:href="@{/auth/signup}">Create
					one here</a></small>
		</div>
	</div>
</body>
</html>
